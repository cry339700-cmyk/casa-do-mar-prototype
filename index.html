<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23191713'/%3E%3Cpath d='M8 26V15a8 8 0 0 1 16 0v11' fill='none' stroke='%23f6f2ea' stroke-width='2.5'/%3E%3C/svg%3E" />
<script>
/* Resolve the palette before the first paint — a flash of the wrong theme is worse
   than a few lines of inline script. app.js re-affirms this on boot. */
(function () {
  var d = document.documentElement;
  try {
    var mode = localStorage.getItem('lcs.theme') || 'auto';
    var accent = localStorage.getItem('lcs.accent') || 'clay';
    var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    d.setAttribute('data-theme', dark ? 'dark' : 'light');
    d.setAttribute('data-theme-mode', mode);
    d.setAttribute('data-accent', accent);
  } catch (e) {
    d.setAttribute('data-theme', 'light');
    d.setAttribute('data-accent', 'clay');
  }
})();
</script>
<link rel="stylesheet" href="assets/styles.css" />
